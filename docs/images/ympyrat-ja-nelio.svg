<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" width="500" height="480">
  <!-- Blue square -->
  <rect x="50" y="10" width="400" height="400" fill="#29b6f6"/>
  <!-- 4 black circles -->
  <circle cx="150" cy="110" r="100" fill="#111"/>
  <circle cx="350" cy="110" r="100" fill="#111"/>
  <circle cx="150" cy="310" r="100" fill="#111"/>
  <circle cx="350" cy="310" r="100" fill="#111"/>
  <!-- r label: line from center to edge of bottom-left circle -->
  <line x1="150" y1="355" x2="250" y2="355" stroke="#e53935" stroke-width="3"/>
  <text x="185" y="395" fill="#e53935" font-size="32" font-style="italic" font-family="serif">r</text>
  <!-- 4r label below square -->
  <text x="215" y="450" fill="#e53935" font-size="32" font-style="italic" font-family="serif">4r</text>
</svg>
